name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "docs/desktop.md"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "docs/desktop.md"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage and deb
            runner: ubuntu-22.04
            bundles: appimage,deb
            artifact: oneday-linux
            paths: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows NSIS
            runner: windows-2025
            bundles: nsis
            artifact: oneday-windows
            paths: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0
        with:
          components: rustfmt, clippy

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Test local desktop UI
        working-directory: desktop
        run: bun run test

      - name: Build local desktop UI
        working-directory: desktop
        run: bun run build

      - name: Check Rust desktop code
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned desktop package
        working-directory: desktop
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Upload short-lived installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 3
