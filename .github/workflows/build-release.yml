name: Build And Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run verification gate
        run: make verify

      - name: Run non-live command smoke checks
        run: |
          go run ./cmd/oneday config show --safe
          go run ./cmd/oneday rag benchmark
          go run ./cmd/oneday story-packs list

  build:
    name: Build ${{ matrix.target.goos }}-${{ matrix.target.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compute build metadata
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
          echo "DIRTY=false" >> "$GITHUB_ENV"
          echo "LDFLAGS=$(bash ./scripts/build-ldflags.sh)" >> "$GITHUB_ENV"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags "$LDFLAGS" -o "dist/oneday-${{ matrix.target.suffix }}${{ matrix.target.ext }}" ./cmd/oneday
          go build -ldflags "$LDFLAGS" -o "dist/oneday-benchmark-${{ matrix.target.suffix }}${{ matrix.target.ext }}" ./cmd/oneday-benchmark
          go build -ldflags "$LDFLAGS" -o "dist/oneday-ascii-benchmark-${{ matrix.target.suffix }}${{ matrix.target.ext }}" ./cmd/oneday-ascii-benchmark

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compute build metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
          echo "DIRTY=false" >> "$GITHUB_ENV"
          echo "LDFLAGS=$(bash ./scripts/build-ldflags.sh)" >> "$GITHUB_ENV"

      - name: Build packaged artifacts
        run: |
          mkdir -p dist package release

          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oneday-linux-amd64 ./cmd/oneday
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oneday-benchmark-linux-amd64 ./cmd/oneday-benchmark
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oneday-ascii-benchmark-linux-amd64 ./cmd/oneday-ascii-benchmark

          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oneday-windows-amd64.exe ./cmd/oneday
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oneday-benchmark-windows-amd64.exe ./cmd/oneday-benchmark
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oneday-ascii-benchmark-windows-amd64.exe ./cmd/oneday-ascii-benchmark

          linux_dir="package/oneday-linux-amd64"
          mkdir -p "$linux_dir"
          cp dist/oneday-linux-amd64 "$linux_dir/oneday"
          cp dist/oneday-benchmark-linux-amd64 "$linux_dir/oneday-benchmark"
          cp dist/oneday-ascii-benchmark-linux-amd64 "$linux_dir/oneday-ascii-benchmark"
          cp config.example.yaml "$linux_dir/config.example.yaml"
          tar -C package -czf release/oneday-linux-amd64.tar.gz oneday-linux-amd64

          windows_dir="package/oneday-windows-amd64"
          mkdir -p "$windows_dir"
          cp dist/oneday-windows-amd64.exe "$windows_dir/oneday.exe"
          cp dist/oneday-benchmark-windows-amd64.exe "$windows_dir/oneday-benchmark.exe"
          cp dist/oneday-ascii-benchmark-windows-amd64.exe "$windows_dir/oneday-ascii-benchmark.exe"
          cp config.example.yaml "$windows_dir/config.example.yaml"
          cd package
          zip -r ../release/oneday-windows-amd64.zip oneday-windows-amd64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
