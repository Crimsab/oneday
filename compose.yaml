name: oneday

services:
  oneday-gateway:
    image: ${ONEDAY_IMAGE:-ghcr.io/crimsab/oneday:latest}
    restart: unless-stopped
    init: true
    working_dir: /app
    ports:
      - "${ONEDAY_PORT:-8788}:8788"
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':8788 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      TZ: ${TZ:-UTC}
      ONEDAY_ROOT: /app
      ONEDAY_GATEWAY_ADDR: 0.0.0.0:8788
      ONEDAY_GATEWAY_STATIC_DIR: /usr/local/share/oneday-gateway/web
      ONEDAY_LITELLM_API_KEY: ${ONEDAY_LITELLM_API_KEY:-}
      ONEDAY_OPENROUTER_API_KEY: ${ONEDAY_OPENROUTER_API_KEY:-}
      ONEDAY_TTS_API_KEY: ${ONEDAY_TTS_API_KEY:-}
      ONEDAY_IMAGEGEN_PROVIDER: ${ONEDAY_IMAGEGEN_PROVIDER:-}
      ONEDAY_IMAGEGEN_BASE_URL: ${ONEDAY_IMAGEGEN_BASE_URL:-}
      ONEDAY_IMAGEGEN_API_KEY: ${ONEDAY_IMAGEGEN_API_KEY:-}
      ONEDAY_IMAGEGEN_OPENCLAW_URL: ${ONEDAY_IMAGEGEN_OPENCLAW_URL:-}
      ONEDAY_IMAGEGEN_BRIDGE_URL: ${ONEDAY_IMAGEGEN_BRIDGE_URL:-}
      ONEDAY_IMAGEGEN_BRIDGE_TOKEN: ${ONEDAY_IMAGEGEN_BRIDGE_TOKEN:-}
      ONEDAY_IMAGEGEN_BRIDGE_PROVIDER: ${ONEDAY_IMAGEGEN_BRIDGE_PROVIDER:-}
      ONEDAY_IMAGEGEN_BRIDGE_MAP_ICON_PROVIDER: ${ONEDAY_IMAGEGEN_BRIDGE_MAP_ICON_PROVIDER:-}
      ONEDAY_IMAGEGEN_BRIDGE_FALLBACKS: ${ONEDAY_IMAGEGEN_BRIDGE_FALLBACKS:-}
      ONEDAY_IMAGEGEN_BRIDGE_FALLBACK_POLICY: ${ONEDAY_IMAGEGEN_BRIDGE_FALLBACK_POLICY:-}
      ONEDAY_IMAGEGEN_BRIDGE_COMPATIBILITY: ${ONEDAY_IMAGEGEN_BRIDGE_COMPATIBILITY:-}
      ONEDAY_IMAGEGEN_MODEL: ${ONEDAY_IMAGEGEN_MODEL:-}
      ONEDAY_IMAGEGEN_MAP_ICON_MODEL: ${ONEDAY_IMAGEGEN_MAP_ICON_MODEL:-}
      ONEDAY_IMAGEGEN_SIZE: ${ONEDAY_IMAGEGEN_SIZE:-}
      ONEDAY_IMAGEGEN_LOCATION_SIZE: ${ONEDAY_IMAGEGEN_LOCATION_SIZE:-}
      ONEDAY_IMAGEGEN_CHARACTER_SIZE: ${ONEDAY_IMAGEGEN_CHARACTER_SIZE:-}
      ONEDAY_IMAGEGEN_RESOLUTION: ${ONEDAY_IMAGEGEN_RESOLUTION:-}
      ONEDAY_IMAGEGEN_LOCATION_RESOLUTION: ${ONEDAY_IMAGEGEN_LOCATION_RESOLUTION:-}
      ONEDAY_IMAGEGEN_CHARACTER_RESOLUTION: ${ONEDAY_IMAGEGEN_CHARACTER_RESOLUTION:-}
      ONEDAY_IMAGEGEN_ASPECT_RATIO: ${ONEDAY_IMAGEGEN_ASPECT_RATIO:-}
      ONEDAY_IMAGEGEN_LOCATION_ASPECT_RATIO: ${ONEDAY_IMAGEGEN_LOCATION_ASPECT_RATIO:-}
      ONEDAY_IMAGEGEN_CHARACTER_ASPECT_RATIO: ${ONEDAY_IMAGEGEN_CHARACTER_ASPECT_RATIO:-}
      ONEDAY_IMAGEGEN_QUALITY: ${ONEDAY_IMAGEGEN_QUALITY:-}
      ONEDAY_IMAGEGEN_OUTPUT_FORMAT: ${ONEDAY_IMAGEGEN_OUTPUT_FORMAT:-}
      ONEDAY_IMAGEGEN_BACKGROUND: ${ONEDAY_IMAGEGEN_BACKGROUND:-}
      ONEDAY_IMAGEGEN_TIMEOUT_SECONDS: ${ONEDAY_IMAGEGEN_TIMEOUT_SECONDS:-}
      ONEDAY_IMAGEGEN_CONCURRENCY: ${ONEDAY_IMAGEGEN_CONCURRENCY:-}
      ONEDAY_IMAGEGEN_AUTOGENERATE: ${ONEDAY_IMAGEGEN_AUTOGENERATE:-}
      ONEDAY_IMAGEGEN_APPEND_NEGATIVE_PROMPT: ${ONEDAY_IMAGEGEN_APPEND_NEGATIVE_PROMPT:-}
      ONEDAY_OTEL_ENABLED: ${ONEDAY_OTEL_ENABLED:-}
      ONEDAY_DEPLOYMENT_ENVIRONMENT: ${ONEDAY_DEPLOYMENT_ENVIRONMENT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-oneday-gateway}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
      - type: volume
        source: oneday_data
        target: /app/oneday_data
    security_opt:
      - no-new-privileges:true

volumes:
  oneday_data:
