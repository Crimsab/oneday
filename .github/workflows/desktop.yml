name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "desktop/**"
      - "gateway/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-ldflags.sh"
      - "scripts/release-desktop-macos-test.sh"
      - "scripts/release-prepare-desktop.sh"
      - "scripts/release-desktop-artifacts.sh"
      - "scripts/release-prepare-updater-config.sh"
      - "scripts/release-metadata.sh"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "desktop/**"
      - "gateway/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-ldflags.sh"
      - "scripts/release-desktop-macos-test.sh"
      - "scripts/release-prepare-desktop.sh"
      - "scripts/release-desktop-artifacts.sh"
      - "scripts/release-prepare-updater-config.sh"
      - "scripts/release-metadata.sh"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage and deb
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: oneday-desktop-linux-ci
            paths: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows NSIS
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: oneday-desktop-windows-ci
            paths: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS DMG (Apple Silicon)
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: oneday-desktop-macos-aarch64-ci
            paths: |
              desktop/src-tauri/target/release/bundle/macos/*.app
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS DMG (Intel)
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: oneday-desktop-macos-x86_64-ci
            paths: |
              desktop/src-tauri/target/release/bundle/macos/*.app
              desktop/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0
        with:
          components: rustfmt, clippy

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked JavaScript dependencies
        shell: bash
        run: |
          (cd gateway/web && bun install --frozen-lockfile)
          (cd desktop && bun install --frozen-lockfile)

      - name: Build standalone package inputs
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          version="$(jq -r .version desktop/package.json)"
          commit="$(git rev-parse HEAD)"
          build_date="$(git show -s --format=%cI HEAD)"
          export VERSION="v$version" COMMIT="$commit" BUILD_DATE="$build_date" DIRTY=false
          ldflags="$(bash scripts/build-ldflags.sh)"
          extension=""
          [[ "$RUNNER_OS" == "Windows" ]] && extension=".exe"
          mkdir -p desktop-inputs
          go build -trimpath -buildvcs=false -ldflags "$ldflags" -o "desktop-inputs/oneday$extension" ./cmd/oneday
          cargo build --locked --release --manifest-path gateway/Cargo.toml
          (cd gateway/web && bun run build)
          ./scripts/release-prepare-desktop.sh \
            "v$version" "$TARGET_TRIPLE" \
            "desktop-inputs/oneday$extension" \
            "gateway/target/release/oneday-gateway$extension" \
            gateway/web/dist

      - name: Assert ordinary packages remain unsigned
        shell: bash
        run: |
          jq -e '.bundle.createUpdaterArtifacts == false' desktop/src-tauri/tauri.conf.json
          [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]
          [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]
          [[ -z "${ONEDAY_UPDATER_ENDPOINT:-}" ]]
          [[ -z "${ONEDAY_UPDATER_PUBKEY:-}" ]]

      - name: Test prepared desktop package
        shell: bash
        run: |
          (cd desktop && bun run test)
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Test launcher accessibility and first-run UX
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e

      - name: Build unsigned desktop package
        working-directory: desktop
        shell: bash
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Upload short-lived installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 2
