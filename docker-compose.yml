services:
  oneday-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: oneday-gateway:local
    container_name: oneday-gateway
    restart: unless-stopped
    working_dir: /opt/oneday
    environment:
      - TZ=Europe/Rome
      - ONEDAY_ROOT=/opt/oneday
      - ONEDAY_GATEWAY_ADDR=0.0.0.0:8788
      - ONEDAY_GATEWAY_STATIC_DIR=/usr/local/share/oneday-gateway/web
      - ONEDAY_LITELLM_API_KEY=${ONEDAY_LITELLM_API_KEY:-}
      - ONEDAY_IMAGEGEN_API_KEY=${ONEDAY_IMAGEGEN_API_KEY:-}
      - ONEDAY_IMAGEGEN_BASE_URL=${ONEDAY_IMAGEGEN_BASE_URL:-}
      - ONEDAY_IMAGEGEN_PROVIDER=${ONEDAY_IMAGEGEN_PROVIDER:-openclaw-bridge}
      - ONEDAY_IMAGEGEN_OPENCLAW_URL=${ONEDAY_IMAGEGEN_OPENCLAW_URL:-http://openclaw-imagegen:8099/generate}
      - ONEDAY_IMAGEGEN_MODEL=${ONEDAY_IMAGEGEN_MODEL:-}
      - ONEDAY_IMAGEGEN_OUTPUT_FORMAT=${ONEDAY_IMAGEGEN_OUTPUT_FORMAT:-png}
      - ONEDAY_IMAGEGEN_BACKGROUND=${ONEDAY_IMAGEGEN_BACKGROUND:-}
      - ONEDAY_IMAGEGEN_SIZE=${ONEDAY_IMAGEGEN_SIZE:-1024x1024}
      - ONEDAY_IMAGEGEN_LOCATION_SIZE=${ONEDAY_IMAGEGEN_LOCATION_SIZE:-1536x1024}
      - ONEDAY_IMAGEGEN_CHARACTER_SIZE=${ONEDAY_IMAGEGEN_CHARACTER_SIZE:-1024x1024}
      - ONEDAY_IMAGEGEN_RESOLUTION=${ONEDAY_IMAGEGEN_RESOLUTION:-}
      - ONEDAY_IMAGEGEN_LOCATION_RESOLUTION=${ONEDAY_IMAGEGEN_LOCATION_RESOLUTION:-}
      - ONEDAY_IMAGEGEN_CHARACTER_RESOLUTION=${ONEDAY_IMAGEGEN_CHARACTER_RESOLUTION:-}
      - ONEDAY_IMAGEGEN_ASPECT_RATIO=${ONEDAY_IMAGEGEN_ASPECT_RATIO:-}
      - ONEDAY_IMAGEGEN_LOCATION_ASPECT_RATIO=${ONEDAY_IMAGEGEN_LOCATION_ASPECT_RATIO:-}
      - ONEDAY_IMAGEGEN_CHARACTER_ASPECT_RATIO=${ONEDAY_IMAGEGEN_CHARACTER_ASPECT_RATIO:-}
      - ONEDAY_IMAGEGEN_TIMEOUT_SECONDS=${ONEDAY_IMAGEGEN_TIMEOUT_SECONDS:-360}
      - ONEDAY_IMAGEGEN_APPEND_NEGATIVE_PROMPT=${ONEDAY_IMAGEGEN_APPEND_NEGATIVE_PROMPT:-true}
      - ONEDAY_IMAGEGEN_AUTOGENERATE=${ONEDAY_IMAGEGEN_AUTOGENERATE:-true}
    volumes:
      - .:/opt/oneday
      - /root/.local/bin/codex:/usr/local/bin/codex:ro
      - /root/.codex/auth.json:/root/.codex/auth.json:ro
      - /root/.codex/config.toml:/root/.codex/config.toml:ro
    dns:
      - 192.168.50.157
    networks:
      - homelab_network

networks:
  homelab_network:
    external: true
