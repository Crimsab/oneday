name: oneday

services:
  oneday-gateway:
    image: ${ONEDAY_IMAGE:-ghcr.io/crimsab/oneday:latest}
    restart: unless-stopped
    init: true
    working_dir: /app
    ports:
      - "${ONEDAY_PORT:-8788}:8788"
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':8788 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      TZ: ${TZ:-UTC}
      ONEDAY_ROOT: /app
      ONEDAY_GATEWAY_ADDR: 0.0.0.0:8788
      ONEDAY_GATEWAY_STATIC_DIR: /usr/local/share/oneday-gateway/web
      ONEDAY_LITELLM_API_KEY: ${ONEDAY_LITELLM_API_KEY:-}
      ONEDAY_OPENROUTER_API_KEY: ${ONEDAY_OPENROUTER_API_KEY:-}
      ONEDAY_IMAGEGEN_PROVIDER: ${ONEDAY_IMAGEGEN_PROVIDER:-}
      ONEDAY_IMAGEGEN_BASE_URL: ${ONEDAY_IMAGEGEN_BASE_URL:-}
      ONEDAY_IMAGEGEN_API_KEY: ${ONEDAY_IMAGEGEN_API_KEY:-}
      ONEDAY_IMAGEGEN_OPENCLAW_URL: ${ONEDAY_IMAGEGEN_OPENCLAW_URL:-}
      ONEDAY_IMAGEGEN_MODEL: ${ONEDAY_IMAGEGEN_MODEL:-}
      ONEDAY_IMAGEGEN_MAP_ICON_MODEL: ${ONEDAY_IMAGEGEN_MAP_ICON_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
      - type: volume
        source: oneday_data
        target: /app/oneday_data
    security_opt:
      - no-new-privileges:true

volumes:
  oneday_data:
