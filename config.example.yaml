# OneDay Configuration

# Data directory for stories, saves, and database
data_dir: "./oneday_data"

# AI Provider configuration
ai:
  # Provider priority (first available is used, others are fallbacks)
  # Options: claude-code, litellm, openrouter
  provider_priority:
    - litellm
    - openrouter
    - claude-code

  # Claude Code CLI (uses your Claude subscription)
  claude_code:
    enabled: false
    # Path to claude CLI binary (leave empty for PATH lookup)
    binary: ""

  # LiteLLM / OpenAI-compatible endpoint
  litellm:
    enabled: true
    # Host-native default. If you run OneDay inside Docker on the homelab network,
    # use http://ai-proxy:4000/v1 instead.
    base_url: "http://llm.example.com/v1"
    api_key: ""
    default_model: "grok-4.1-fast"

  # OpenRouter
  openrouter:
    enabled: false
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""
    default_model: "google/gemini-2.5-flash-lite"

  # Embedding model (for RAG)
  embedding:
    model: "text-embedding-3-small"
    # Uses the first available provider that supports embeddings

  # Optional ambient ASCII-art generation for scene headers/signage/maps/etc.
  ascii_art:
    enabled: true
    # Use the local LiteLLM alias when available; direct OpenRouter slugs also work
    # if the fallback chain reaches the OpenRouter provider.
    model: "ascii-ambient"
    temperature: 0.4
    max_tokens: 400
    timeout_seconds: 25

  # Generation settings
  generation:
    temperature: 0.8
    max_tokens: 2048
    timeout_seconds: 60
    # Optional dedicated repair/validator model for schema-fix passes.
    # Leave empty to reuse the main provider/model path.
    repair_model: ""

# RAG settings
rag:
  # Summarize every N turns
  summarize_every: 10
  # Number of relevant chunks to retrieve
  top_k: 5
  # Embedding dimensions
  dimensions: 1536

# Game settings
game:
  # Autosave every N turns
  autosave_every: 5
  # Enable typewriter effect for AI responses
  typewriter_effect: true
  # Typewriter speed (characters per second)
  typewriter_speed: 80
