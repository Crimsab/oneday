# OneDay Configuration
config_version: 3

# Data directory for stories, saves, and database
data_dir: "./oneday_data"

# Interface language only. Leave empty for OS locale detection, or set en/it.
# This never changes a story's language or spoken-audio language.
interface:
  locale: ""

# AI Provider configuration
ai:
  # Provider priority (first available is used, others are fallbacks)
  # Options: codex, claude-code, litellm, openrouter
  provider_priority:
    - litellm
    - openrouter
    - codex
    - claude-code

  # OpenAI Codex CLI (uses local `codex login` OAuth/API auth)
  codex:
    enabled: false
    # Path to codex CLI binary (leave empty for PATH lookup)
    binary: ""
    model: "gpt-5.4-mini"
    # Options: off, none, minimal, low, medium, high, xhigh
    reasoning: "off"
    # Codex is generation-only. RAG embeddings still require LiteLLM/OpenRouter.

  # Claude Code CLI (uses your Claude subscription)
  claude_code:
    enabled: false
    # Path to claude CLI binary (leave empty for PATH lookup)
    binary: ""

  # LiteLLM / OpenAI-compatible endpoint
  litellm:
    enabled: true
    # Default for a LiteLLM proxy running on the same machine.
    base_url: "http://127.0.0.1:4000/v1"
    api_key: "${ONEDAY_LITELLM_API_KEY}"
    default_model: "gpt-5.4-mini"

  # OpenRouter
  openrouter:
    enabled: false
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${ONEDAY_OPENROUTER_API_KEY}"
    default_model: "google/gemini-2.5-flash-lite"

  # Embedding model (for RAG)
  embedding:
    model: "text-embedding-3-small"
    provider: "auto"
    # Use "auto" to pick the first enabled embedding-capable provider in the
    # priority chain, or force one of: litellm, openrouter, local
    # Local embeddings do not require API keys. Ollama is the easiest backend,
    # but custom local HTTP embedding endpoints are also supported.
    local:
      enabled: false
      # ollama: POST {base_url}/api/embed
      # custom: POST {base_url} with {"model":"...","input":"..."}
      type: "ollama"
      base_url: "http://127.0.0.1:11434"
      # Recommended multilingual/Italian default. Alternatives:
      # nomic-embed-text (fast/light), mxbai-embed-large (English), qwen3-embedding (heavier/quality)
      model: "bge-m3"
      dimensions: 1024

  # Optional ambient ASCII-art generation for scene headers/signage/maps/etc.
  ascii_art:
    enabled: true
    # Use the local LiteLLM alias when available; direct OpenRouter slugs also work
    # if the fallback chain reaches the OpenRouter provider.
    model: "ascii-ambient"
    temperature: 0.4
    max_tokens: 400
    timeout_seconds: 25

  # Non-blocking visual asset generation for locations, characters, and story art.
  # Environment variables with ONEDAY_IMAGEGEN_* override these values at runtime.
  image_generation:
    # Preferred: imagegen-bridge native API. Legacy openclaw-bridge and generic
    # OpenAI-compatible /images/generations endpoints remain supported.
    provider: "imagegen-bridge"
    base_url: ""
    api_key: ""
    model: "gpt-image-2"
    map_icon_model: "gpt-image-2"
    openclaw_bridge_url: "http://127.0.0.1:8099/generate"
    imagegen_bridge_url: "http://127.0.0.1:8787"
    imagegen_bridge_token: "${ONEDAY_IMAGEGEN_BRIDGE_TOKEN}"
    imagegen_bridge_provider: "codex-responses"
    imagegen_bridge_map_icon_provider: "codex-responses"
    # Ordered PROVIDER or PROVIDER:MODEL routes. Fallbacks require isolated sessions.
    imagegen_bridge_fallbacks: ["codex-app-server:gpt-image-2"]
    imagegen_bridge_fallback_policy: "on_error"
    imagegen_bridge_compatibility: "normalize"
    default_size: "1024x1024"
    location_size: "1536x1024"
    character_size: "1024x1024"
    default_resolution: ""
    location_resolution: ""
    character_resolution: ""
    default_aspect_ratio: ""
    location_aspect_ratio: ""
    character_aspect_ratio: ""
    quality: ""
    output_format: "png"
    background: ""
    timeout_seconds: 360
    # Enable only after the selected bridge or endpoint is reachable.
    auto_generate: false
    append_negative_prompt: true

  # Optional spoken narration and character voices. Providers are disabled by
  # default; text remains canonical when synthesis is unavailable.
  tts:
    output_dir: "./oneday_data/audio"
    timeout_seconds: 45
    provider_order: [local, cloud]
    cloud:
      enabled: false
      base_url: "https://api.openai.com/v1"
      api_key: "${ONEDAY_TTS_API_KEY}"
      model: "gpt-4o-mini-tts"
      voice: "alloy"
      version: "1"
      languages: [en, it]
    local:
      enabled: false
      base_url: "http://127.0.0.1:5000"
      api_key: ""
      model: "piper"
      voice: ""
      version: "1"
      languages: [en, it]

  # Generation settings
  generation:
    temperature: 0.8
    max_tokens: 2048
    timeout_seconds: 60
    # Utility/ancillary model for repair, validation, and other small side calls.
    utility_model: "gpt-5.4-mini"
    # Optional dedicated repair/validator model for schema-fix passes.
    # Primary repair model plus ordered fallbacks.
    repair_model: "gpt-5.4-mini"
    repair_fallback_models:
      - "gpt-5.4-mini"

# RAG settings
rag:
  enabled: true
  # Summarize every N turns
  summarize_every: 10
  # Number of relevant chunks to retrieve
  top_k: 5
  # Embedding dimensions
  dimensions: 1536

# Game settings
game:
  # Autosave every N turns
  autosave_every: 5
  # Enable typewriter effect for AI responses
  typewriter_effect: true
  # Typewriter speed (characters per second)
  typewriter_speed: 80
  # Expose /thoughts to inspect NPC private thoughts (debug/storyteller mode)
  visible_private_thoughts: false
  # Reward economy: generous, balanced, or harsh
  reward_budget: balanced
