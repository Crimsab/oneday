name: Release Please

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.event_name == 'workflow_run' && 'prepare' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  release:
    name: Prepare release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Run Release Please
        id: release
        if: inputs.release_tag == ''
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve publication target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          should_publish="${RELEASE_CREATED:-false}"
          tag="${CREATED_TAG:-}"

          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Invalid release tag: $REQUESTED_TAG" >&2
              exit 1
            fi
            gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            should_publish=true
            tag="$REQUESTED_TAG"
          fi

          if [[ "$should_publish" == "true" && -z "$tag" ]]; then
            echo "Release target is missing its tag" >&2
            exit 1
          fi
          {
            echo "should_publish=$should_publish"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch lightweight release validation
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--branches--main"))][0].headRefName // empty')"
          [[ -n "$branch" ]] || { echo "Release Please PR branch was not found" >&2; exit 1; }
          gh workflow run release-pr.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

      - name: Dispatch public release publisher
        if: steps.target.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: gh workflow run publish-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="$RELEASE_TAG"
