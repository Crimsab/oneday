services:
  oneday-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: oneday-gateway:local
    container_name: oneday-gateway
    restart: unless-stopped
    working_dir: /opt/oneday
    environment:
      - TZ=Europe/Rome
      - ONEDAY_ROOT=/opt/oneday
      - ONEDAY_GATEWAY_ADDR=0.0.0.0:8788
    volumes:
      - .:/opt/oneday
    dns:
      - 192.168.50.157
    networks:
      - homelab_network

networks:
  homelab_network:
    external: true
