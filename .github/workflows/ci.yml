name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".release-please-manifest.json"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Scan tracked content
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 dir --no-banner --redact /repo

      - name: Scan locked dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0
        with:
          components: rustfmt, clippy

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        working-directory: gateway/web
        run: bun install --frozen-lockfile

      - name: Run Go verification gate
        run: make verify

      - name: Scan Go dependencies for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Run non-live command smoke checks
        run: |
          go run ./cmd/oneday config show --safe
          go run ./cmd/oneday rag benchmark
          go run ./cmd/oneday story-packs list
          go run ./cmd/oneday-minigame-eval -corpus internal/engine/testdata/minigame-evals.json

      - name: Run migration and compatibility gates
        run: |
          go test -count=1 ./internal/storage -run 'TestMigration|TestLegacy|TestVisualCanon|TestWorldCanon|TestSnapshot'
          go test -count=1 ./internal/engine -run 'TestLoadStoryPack|TestSaveGame|TestLoadGame|TestLegacy|TestOutcome|TestOffscreen'

      - name: Cross-compile release binaries
        run: |
          mkdir -p dist
          ldflags="$(bash ./scripts/build-ldflags.sh)"

          GOOS=linux GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-linux-amd64 ./cmd/oneday
          GOOS=linux GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-benchmark-linux-amd64 ./cmd/oneday-benchmark
          GOOS=linux GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-ascii-benchmark-linux-amd64 ./cmd/oneday-ascii-benchmark

          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-windows-amd64.exe ./cmd/oneday
          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-benchmark-windows-amd64.exe ./cmd/oneday-benchmark
          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-ascii-benchmark-windows-amd64.exe ./cmd/oneday-ascii-benchmark

      - name: Check gateway formatting
        run: cargo fmt --manifest-path gateway/Cargo.toml -- --check

      - name: Test gateway
        run: cargo test --manifest-path gateway/Cargo.toml

      - name: Lint gateway
        run: cargo clippy --manifest-path gateway/Cargo.toml --all-targets -- -A clippy::too_many_arguments -D warnings

      - name: Build gateway
        run: cargo build --manifest-path gateway/Cargo.toml

      - name: Run web tests
        working-directory: gateway/web
        run: bun run test

      - name: Build web app
        working-directory: gateway/web
        run: bun run build

      - name: Install Chromium
        working-directory: gateway/web
        run: bunx playwright install --with-deps chromium

      - name: Run desktop and mobile browser gates
        working-directory: gateway/web
        run: bun run test:e2e

      - name: Build and smoke-test gateway image
        run: |
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          docker build \
            -f gateway/Dockerfile \
            --build-arg VERSION=ci \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg DIRTY=false \
            -t oneday-gateway:ci \
            .

          version_output="$(docker run --rm --entrypoint oneday oneday-gateway:ci --version)"
          printf '%s\n' "$version_output"
          grep -Fqx 'oneday ci' <<<"$version_output"
          grep -Fqx "commit: ${GITHUB_SHA:0:12}" <<<"$version_output"
          grep -Fqx 'dirty: false' <<<"$version_output"
