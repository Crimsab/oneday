name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: [self-hosted, Linux, X64, homelab-main, oneday]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint GitHub Actions
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest .
          ./actionlint -color

  go-check:
    name: Go checks
    runs-on: [self-hosted, Linux, X64, homelab-main, oneday]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run verification gate
        run: make verify

      - name: Run non-live command smoke checks
        run: |
          go run ./cmd/oneday config show --safe
          go run ./cmd/oneday rag benchmark
          go run ./cmd/oneday story-packs list
          go run ./cmd/oneday-minigame-eval -corpus internal/engine/testdata/minigame-evals.json

      - name: Run migration and compatibility gates
        run: |
          go test -count=1 ./internal/storage -run 'TestMigration|TestLegacy|TestVisualCanon|TestWorldCanon|TestSnapshot'
          go test -count=1 ./internal/engine -run 'TestLoadStoryPack|TestSaveGame|TestLoadGame|TestLegacy|TestOutcome|TestOffscreen'

      - name: Cross-compile release binaries
        run: |
          mkdir -p dist
          ldflags="$(bash ./scripts/build-ldflags.sh)"

          GOOS=linux GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-linux-amd64 ./cmd/oneday
          GOOS=linux GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-benchmark-linux-amd64 ./cmd/oneday-benchmark
          GOOS=linux GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-ascii-benchmark-linux-amd64 ./cmd/oneday-ascii-benchmark

          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-windows-amd64.exe ./cmd/oneday
          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-benchmark-windows-amd64.exe ./cmd/oneday-benchmark
          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/oneday-ascii-benchmark-windows-amd64.exe ./cmd/oneday-ascii-benchmark

  gateway-rust-check:
    name: Gateway Rust checks
    runs-on: [self-hosted, Linux, X64, homelab-main, oneday]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check gateway formatting
        run: cargo fmt --manifest-path gateway/Cargo.toml -- --check

      - name: Test gateway
        run: cargo test --manifest-path gateway/Cargo.toml

      - name: Lint gateway
        run: cargo clippy --manifest-path gateway/Cargo.toml --all-targets -- -A clippy::too_many_arguments -D warnings

      - name: Build gateway
        run: cargo build --manifest-path gateway/Cargo.toml

  gateway-web-check:
    name: Gateway web checks
    runs-on: [self-hosted, Linux, X64, homelab-main, oneday]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dependencies
        working-directory: gateway/web
        run: bun install --frozen-lockfile

      - name: Warm Go command cache
        run: go build ./cmd/oneday

      - name: Run web tests
        working-directory: gateway/web
        run: bun run test

      - name: Build web app
        working-directory: gateway/web
        run: bun run build

      - name: Install Chromium
        working-directory: gateway/web
        run: bunx playwright install --with-deps chromium

      - name: Run desktop and mobile browser gates
        working-directory: gateway/web
        run: bun run test:e2e

  gateway-docker-build:
    name: Gateway Docker build
    runs-on: [self-hosted, Linux, X64, homelab-main, oneday]
    needs:
      - gateway-rust-check
      - gateway-web-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build gateway image
        run: docker build -f gateway/Dockerfile .
